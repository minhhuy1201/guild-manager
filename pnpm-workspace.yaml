packages:
  - "apps/*"
  - "packages/*"

# Node 24 chỉ là gợi ý nếu không ai ép: `engines.node` của mỗi package thành lỗi cài đặt thật.
allowBuilds:
  # jest-haste-map kéo @parcel/watcher vào từ jest 30.5; nó đã có sẵn binary prebuilt theo
  # nền tảng (@parcel/watcher-linux-x64-glibc, …) nên bước node-gyp là thừa.
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  unrs-resolver: true

engineStrict: true

# Nâng sàn phiên bản cho các dependency gián tiếp có advisory đang mở trên Dependabot.
# Không package nào trong workspace khai báo chúng trực tiếp, nên override là chỗ duy nhất
# ép được bản vá. Gỡ một dòng khi dependency cha đã tự nâng qua mốc tương ứng.
overrides:
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@2": "^2.1.4"
  "brace-expansion@>=4": "^5.0.9"
  baseline-browser-mapping: "^2.11.0"
  browserslist: "^4.28.7"
  deepmerge-ts: "^8.0.0"
  fast-uri: "^3.1.5"
  "@hono/node-server": "^1.19.15"
  hono: "^4.12.34"
  ip-address: "^10.3.1"
  "js-yaml@3": "^3.15.1"
  "js-yaml@4": "^4.3.1"
  multer: "^2.3.0"
  mysql2: "^3.22.0"
  "nanoid@3": "^3.3.18"
  postcss: "^8.5.23"
  qs: "^6.16.0"
  undici: "^7.29.0"
