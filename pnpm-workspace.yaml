packages:
  - "apps/*"
  - "packages/*"

# Node 24 chỉ là gợi ý nếu không ai ép: `engines.node` của mỗi package thành lỗi cài đặt thật.
engineStrict: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
  # Prisma 7 chạy rust-free, không cần postinstall script tải engine.
  - "@prisma/engines"
  - "@scarf/scarf"
  - prisma
