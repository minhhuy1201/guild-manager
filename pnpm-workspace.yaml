packages:
  - "apps/*"
  - "packages/*"

# Node 24 is only a suggestion unless something enforces it: this turns each package's
# `engines.node` into a real install error.
allowBuilds:
  # jest-haste-map pulls @parcel/watcher in through jest 30.5; it already ships per-platform
  # prebuilt binaries (@parcel/watcher-linux-x64-glibc, …), so the node-gyp step is redundant.
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  unrs-resolver: true

engineStrict: true

# Raises the version floor for transitive dependencies with an advisory open on Dependabot.
# No package in the workspace declares them directly, so an override is the only place the patched
# version can be forced. Drop a line once the parent dependency has moved past that mark itself.
overrides:
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@2": "^2.1.4"
  "brace-expansion@>=4": "^5.0.9"
  baseline-browser-mapping: "^2.11.0"
  browserslist: "^4.28.7"
  deepmerge-ts: "^8.0.0"
  fast-uri: "^3.1.5"
  "@hono/node-server": "^1.19.15"
  hono: "^4.12.34"
  ip-address: "^10.3.1"
  "js-yaml@3": "^3.15.1"
  "js-yaml@4": "^4.3.1"
  multer: "^2.3.0"
  mysql2: "^3.22.0"
  "nanoid@3": "^3.3.18"
  postcss: "^8.5.23"
  qs: "^6.16.0"
  undici: "^7.29.0"
