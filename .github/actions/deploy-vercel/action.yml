name: Deploy to Vercel
description: Upload the repo-root source to a Vercel project and wait for the build to finish.

inputs:
  project-id:
    description: ID of the Vercel project this deploy goes to.
    required: true
  token:
    description: A Vercel token allowed to deploy (secrets.VERCEL_TOKEN).
    required: true

runs:
  using: composite
  steps:
    # `vercel` reads an empty token as "missing value for --token" - a message that never hints
    # the secret was not loaded. Fail early so the error points at the thing to fix.
    - name: Check the Vercel token is present
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$VERCEL_TOKEN" ]; then
          echo "::error::secrets.VERCEL_TOKEN is empty or unset." >&2
          echo "Create a token at https://vercel.com/account/settings/tokens, then add it under" >&2
          echo "Settings -> Secrets and variables -> Actions in this repository." >&2
          exit 1
        fi

    # Not `vercel build --prebuilt`: environment variables marked Sensitive cannot be fetched by
    # `vercel pull`, so building here would bake in empty values. Uploading the source lets Vercel
    # build with the real variables, exactly as the git integration used to.
    #
    # Run from the repo root: the project's Root Directory (apps/api, apps/web) is applied by
    # Vercel to the uploaded source, just as it is on a git deploy.
    - name: Deploy
      shell: bash
      env:
        VERCEL_PROJECT_ID: ${{ inputs.project-id }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: npx --yes vercel@59 deploy --prod --yes
