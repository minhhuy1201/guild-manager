name: Setup workspace
description: Cài pnpm, Node và dependencies của monorepo cho một job CI.

runs:
  using: composite
  steps:
    # Không khai báo `version` ở đây: root package.json đã ghi `packageManager: pnpm@…`, và
    # action từ chối chạy khi thấy hai nguồn ("Multiple versions of pnpm specified"). Để
    # packageManager làm nguồn duy nhất còn ghim đúng bản vá thay vì thả nổi ở "10".
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # `postinstall` của apps/api chạy `prisma generate`, và prisma.config.ts gọi loadPrismaEnv()
    # — hàm này ném lỗi khi apps/api/.env không tồn tại, rồi nạp file đó với override: true.
    # Biến môi trường ở cấp job vì thế không thay được file; CI phải dựng file từ template.
    # Giá trị trong template trỏ về localhost, không có secret, và không job nào kết nối database.
    - name: Prepare the API env file
      shell: bash
      run: cp apps/api/.env.example apps/api/.env

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
