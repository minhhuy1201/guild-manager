name: Setup workspace
description: Install pnpm, Node and the monorepo's dependencies for a CI job.

runs:
  using: composite
  steps:
    # No `version` here: the root package.json already carries `packageManager: pnpm@…`, and the
    # action refuses to run when it sees two sources ("Multiple versions of pnpm specified").
    # Letting packageManager be the single source also pins the exact patch instead of floating
    # on "10".
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # The `postinstall` of apps/api runs `prisma generate`, and prisma.config.ts calls
    # loadPrismaEnv() - which throws when apps/api/.env is missing, then loads that file with
    # override: true. Job-level environment variables therefore cannot stand in for the file; CI
    # has to build it from the template. The template's values point at localhost, hold no secret,
    # and no job here connects to a database.
    - name: Prepare the API env file
      shell: bash
      run: cp apps/api/.env.example apps/api/.env

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
