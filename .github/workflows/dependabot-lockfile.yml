name: Dependabot lockfile

on:
  pull_request:
    branches: [main]

concurrency:
  group: dependabot-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    name: Sync pnpm lockfile
    # The GITHUB_TOKEN of a run triggered by Dependabot is always read-only, however widely this
    # block declares it. The commit in the last step therefore goes through a separate PAT, not
    # through the default token.
    permissions:
      contents: read
    # `directories:` in dependabot.yml points at apps/* and packages/*, while pnpm-lock.yaml sits
    # at the root. Dependabot looks for a lockfile in exactly the directories it is configured
    # with, finds none, so its PRs only change package.json - and every CI job then dies at
    # `pnpm install --frozen-lockfile`. This job patches that hole: resolve the lockfile against
    # the new manifests, then commit it back onto the PR branch.
    #
    # The head of a Dependabot PR is always a branch in this repository; the second condition
    # blocks a fork from impersonating the actor to make this job commit content it controls.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull_request run defaults to the merge ref (detached). Checking out the branch head
          # is what makes `git diff` compare against what Dependabot just committed.
          ref: ${{ github.event.pull_request.head.ref }}

      # Not ./.github/actions/setup-workspace: that action installs with --frozen-lockfile, so it
      # would die on the very failure this job exists to fix.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --lockfile-only resolves and writes pnpm-lock.yaml and nothing else: no node_modules
      # linking, no lifecycle scripts. That removes the need to build apps/api/.env for
      # postinstall, and keeps the freshly bumped dependency's code from running inside the one
      # job that holds write access.
      - name: Resolve the lockfile against the bumped manifests
        run: pnpm install --lockfile-only

      - name: Detect a lockfile change
        id: diff
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # createCommitOnBranch instead of `git push`, and NOT because of signing: the `main
      # protection` ruleset only targets `~DEFAULT_BRANCH`, so a dependabot/* branch is never
      # asked for signed commits - `git push` would pass too. The reason is that it avoids
      # setting up a git identity and a credential helper on the runner for exactly one file, and
      # a commit created through the API comes signed by GitHub, so the branch never mixes one
      # unsigned commit in among signed ones.
      # expectedHeadOid is a compare-and-set: if Dependabot force-pushes the branch while this job
      # is still resolving, the mutation is rejected instead of writing the lockfile over a
      # different set of manifests.
      - name: Commit the lockfile
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_LOCKFILE_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secrets.DEPENDABOT_LOCKFILE_TOKEN is empty or unset. It is a Dependabot secret, not an Actions secret - see docs/production.md §6." >&2
            exit 1
          fi

          # The lockfile's base64 runs to ~640 KB, past Linux's 128 KiB MAX_ARG_STRLEN for a
          # single argument, so `--arg contents "$(...)"` dies with "Argument list too long".
          # `--rawfile` reads straight from the file, never through argv, so it has no ceiling.
          base64 -w0 pnpm-lock.yaml > "$RUNNER_TEMP/lockfile.b64"

          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg oid "$EXPECTED_HEAD" \
            --rawfile contents "$RUNNER_TEMP/lockfile.b64" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  expectedHeadOid: $oid,
                  message: { headline: "chore(deps): sync pnpm-lock.yaml with the bumped manifests" },
                  fileChanges: { additions: [{ path: "pnpm-lock.yaml", contents: ($contents | rtrimstr("\n")) }] }
                }
              }
            }' > "$RUNNER_TEMP/payload.json"

          gh api graphql --input "$RUNNER_TEMP/payload.json"
