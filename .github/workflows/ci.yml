name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Push liên tiếp lên cùng một nhánh: hủy run cũ, chỉ giữ run mới nhất. Trừ main — ở đó run
  # nào cũng deploy, hủy giữa chừng sẽ bỏ lại một deploy dở dang không ai theo dõi. Cùng
  # group nhưng không hủy nghĩa là các run trên main xếp hàng, deploy chạy đúng thứ tự commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Định danh project trên Vercel — không phải secret, tự chúng không cho quyền gì. Quyền deploy
# nằm ở secrets.VERCEL_TOKEN. Để ở đây thay vì trong secrets để config đi cùng lịch sử git.
env:
  VERCEL_ORG_ID: team_dq9qUn1nvLYKPFaEhd3kmpcx
  VERCEL_API_PROJECT_ID: prj_c8MfMh6UjalladBwl4seKidsFfLs
  VERCEL_WEB_PROJECT_ID: prj_NQb6Wdj6quicozmVNVFk0Kd8Za1T

jobs:
  # Cửa vào của mọi job khác: commit này chạm phần nào của monorepo. Một commit chỉ sửa docs
  # không khớp filter nào, nên toàn bộ job phía sau bị skip và không có gì deploy lại.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # `global` gộp vào cả hai: packages/shared là contract chung của web và API, còn
      # lockfile, workspace, .nvmrc và chính CI đổi thì không app nào còn được coi là chưa
      # đụng tới.
      api: ${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.global == 'true' }}
      web: ${{ steps.filter.outputs.web == 'true' || steps.filter.outputs.global == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
            global:
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - '.github/**'

  backend-test:
    name: Backend test
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter api test

  frontend-test:
    name: Frontend test
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter web test

  quality-api:
    name: Lint & typecheck API
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - name: Lint api
        run: pnpm --filter api lint
      - name: Prettier api
        run: pnpm --filter api format:check
      - name: Typecheck api
        run: pnpm --filter api typecheck

  quality-web:
    name: Lint & typecheck web
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - name: Lint web
        run: pnpm --filter web lint
      - name: Typecheck web
        run: pnpm --filter web typecheck

  build-api:
    name: Build API
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter api build

  build-web:
    name: Build web
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - name: Build web
        # Giá trị giả cho khâu build: `next build` ném lỗi nếu thiếu NEXT_PUBLIC_API_URL ở
        # production, còn AUTH_SECRET phải đủ 32 ký tự. Không cái nào chạm hạ tầng thật.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          AUTH_SECRET: ci-placeholder-secret-0123456789abcdef
        run: pnpm --filter web build

  # Migration chạy sau khi test xanh và TRƯỚC deploy-api: code mới luôn gặp schema mới, không
  # bao giờ ngược lại. Trước đây bước này làm tay từ máy local, nằm ngoài lưới an toàn của CI —
  # một deploy hỏng sau khi migrate đã chạy sẽ để production ở trạng thái schema mới + code cũ.
  #
  # `migrate deploy` chỉ áp dụng migration đã commit, không bao giờ tự sinh và không hỏi gì; khi
  # không có migration nào pending nó là no-op, nên chạy ở mọi commit chạm apps/api là an toàn.
  migrate:
    name: Migrate production database
    needs: [changes, backend-test, frontend-test, quality-api, quality-web, build-api, build-web]
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace

      # `migrate:prod` đặt PRISMA_ENV_FILE=.env.production, và loadPrismaEnv() ném lỗi khi file
      # đó không tồn tại — cố tình như vậy, để một lệnh nhắm production không âm thầm rơi về
      # database khác. Trên runner không có file nào nên phải dựng từ secret.
      #
      # Không đặt biến ở cấp job được: setup-workspace copy .env.example thành .env và
      # loadPrismaEnv() nạp file với override: true, nên file luôn thắng biến môi trường.
      - name: Write the production env file
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "::error::secrets.DIRECT_DATABASE_URL rỗng hoặc chưa được đặt." >&2
            echo "Lấy giá trị trong apps/api/.env.production rồi thêm vào" >&2
            echo "Settings → Secrets and variables → Actions của repo." >&2
            exit 1
          fi
          # DATABASE_URL cũng được ghi: prisma.config.ts đọc DIRECT_DATABASE_URL trước, nhưng
          # loadPrismaEnv() vẫn cần một nguồn biến hợp lệ nếu file rỗng.
          {
            printf 'DATABASE_URL=%s\n' "$DIRECT_DATABASE_URL"
            printf 'DIRECT_DATABASE_URL=%s\n' "$DIRECT_DATABASE_URL"
          } > apps/api/.env.production

      - name: Show what production is behind
        run: pnpm --filter api migrate:prod:status

      - name: Apply migrations
        run: pnpm --filter api migrate:prod

  # Deploy chạy sau khi TOÀN BỘ job kiểm thử xanh, và chỉ khi commit đã nằm trên main.
  #
  # Từ khi các job kiểm thử bị lọc theo phần, `needs` một mình không còn đủ để chặn: một
  # dependency bị skip hợp lệ (phần đó không đổi) cũng làm job needs bị skip theo. Nên điều
  # kiện phải là always() cộng với việc tự kiểm tra không dependency nào fail hoặc bị hủy.
  #
  # Vercel không tự deploy nữa (git.deploymentEnabled = false trong apps/*/vercel.json), nên
  # đây là đường duy nhất đưa code lên production.
  deploy-api:
    name: Deploy API
    # Ghi lại bản deploy vào tab Deployments của GitHub. `vercel deploy` chạy bằng token nên
    # không tạo record nào; từ khi git integration bị tắt, tab đó đứng yên ở lần cuối
    # vercel[bot] ghi (2026-08-16) dù production vẫn lên đều.
    environment:
      name: production-api
      url: https://guild-manager-api.vercel.app
    needs: [changes, backend-test, frontend-test, quality-api, quality-web, build-api, build-web, migrate]
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-vercel
        with:
          project-id: ${{ env.VERCEL_API_PROJECT_ID }}
          token: ${{ secrets.VERCEL_TOKEN }}

  # Frontend deploy sau backend: web gọi API, nên API phải sẵn sàng trước. Khi commit chỉ chạm
  # web, deploy-api bị skip và job này vẫn chạy — thứ tự chỉ ràng buộc khi cả hai cùng deploy.
  deploy-web:
    name: Deploy web
    environment:
      name: production-web
      url: https://mmgh-nth.vercel.app
    needs: [changes, backend-test, frontend-test, quality-api, quality-web, build-api, build-web, migrate, deploy-api]
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-vercel
        with:
          project-id: ${{ env.VERCEL_WEB_PROJECT_ID }}
          token: ${{ secrets.VERCEL_TOKEN }}
