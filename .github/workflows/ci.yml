name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Back-to-back pushes to one branch: cancel the older run, keep only the newest. Except on
  # main - every run there deploys, and cancelling midway leaves a half-finished deploy nobody is
  # watching. Same group without cancelling means runs on main queue up and deploy in commit order.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Vercel project identifiers - not secrets, they grant nothing on their own. The right to deploy
# lives in secrets.VERCEL_TOKEN. Kept here rather than in secrets so the config travels with git
# history.
env:
  VERCEL_ORG_ID: team_dq9qUn1nvLYKPFaEhd3kmpcx
  VERCEL_API_PROJECT_ID: prj_c8MfMh6UjalladBwl4seKidsFfLs
  VERCEL_WEB_PROJECT_ID: prj_NQb6Wdj6quicozmVNVFk0Kd8Za1T

jobs:
  # The gate every other job passes through: which part of the monorepo this commit touched. A
  # docs-only commit matches no filter, so every job below is skipped and nothing redeploys.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # `global` folds into both: packages/shared is the contract web and API share, and once the
      # lockfile, the workspace, .nvmrc or CI itself changes, neither app can still count as
      # untouched.
      api: ${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.global == 'true' }}
      web: ${{ steps.filter.outputs.web == 'true' || steps.filter.outputs.global == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
            global:
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - '.github/**'

  backend-test:
    name: Backend test
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter api test

  frontend-test:
    name: Frontend test
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter web test

  quality-api:
    name: Lint & typecheck API
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Lint api
        run: pnpm --filter api lint
      - name: Prettier api
        run: pnpm --filter api format:check
      - name: Typecheck api
        run: pnpm --filter api typecheck

  quality-web:
    name: Lint & typecheck web
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Lint web
        run: pnpm --filter web lint
      - name: Typecheck web
        run: pnpm --filter web typecheck

  # The question no job above asks: how much of the NEW code in this PR is tested, how much of it
  # is duplicated, which smells are piling up. ESLint reads one file at a time and CodeQL only
  # cares about security. Sonar's quality gate measures *new code*, so it tightens gradually
  # instead of demanding a repo-wide cleanup.
  #
  # This job is NOT in the `needs` of migrate/deploy - the same reason Trivy and CodeQL are not:
  # it gates the merge into main as a required status check, and a commit that already cleared
  # that gate has nothing left to stop.
  sonarqube:
    name: SonarQube
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar reads git history to tell which lines are "new". A shallow clone (depth 1 by
          # default) has no history, so every "on New Code" condition in the quality gate is
          # computed wrong - silently, with no error. Only this job needs it; nothing else
          # touches git blame.
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace

      # Fail here rather than let the scanner die on a Sonar authentication error that never says
      # what is missing. Same shape as the DIRECT_DATABASE_URL check in the migrate job below.
      - name: Check the Sonar token is present
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::secrets.SONAR_TOKEN is empty or unset." >&2
            echo "Create a token in SonarQube Cloud (My Account -> Security), then add it under" >&2
            echo "Settings -> Secrets and variables -> Actions in this repository." >&2
            exit 1
          fi

      # The tests run again here, on top of backend-test/frontend-test, and that is deliberate:
      # the alternative is uploading lcov as an artifact and downloading it back, four more YAML
      # steps that break in the most common case - a PR touching only apps/web skips backend-test,
      # so there is no artifact to download. Runners on a public repo have no minute limit, so what
      # is worth saving is the number of places that can break.
      #
      # Both run even when only one side changed: Sonar analyses the whole project, and submitting
      # half the coverage report drops the other half to 0% on the dashboard.
      - name: Coverage api
        run: pnpm --filter api test:cov
      - name: Coverage web
        run: pnpm --filter web test:cov

      # SONAR_HOST_URL is left unset on purpose: that variable is only for a self-hosted SonarQube
      # Server. On Cloud the token already identifies the org and the scanner knows where to go.
      # The version is not cosmetic for this action: v4.1.0 carries two high advisories (command
      # injection GHSA-f79p-9c5r-xg88, argument injection GHSA-5xq9-5g24-4g6f) so `Dependency
      # review` blocks the PR, and it also calls `actions/cache@v4.0.2` - a version GitHub stopped
      # serving, which kills the job at "Set up job" before a single line runs.
      - name: Scan and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # `wait` is what turns this job into a gate: without it the scanner submits its report
          # and exits 0, and a red quality gate stops nobody. Every other setting lives in
          # sonar-project.properties.
          args: -Dsonar.qualitygate.wait=true

  build-api:
    name: Build API
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter api build

  build-web:
    name: Build web
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Build web
        # Placeholder values for the build alone: `next build` throws when NEXT_PUBLIC_API_URL is
        # missing in production, and AUTH_SECRET must be at least 32 characters. Neither one
        # touches real infrastructure.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          AUTH_SECRET: ci-placeholder-secret-0123456789abcdef
        run: pnpm --filter web build

  # Migrations run once the tests are green and BEFORE deploy-api: new code always meets the new
  # schema, never the other way round. This step used to be run by hand from a local machine,
  # outside CI's safety net - a deploy that failed after the migration had run left production on
  # the new schema with the old code.
  #
  # `migrate deploy` only applies committed migrations, never generates one and never prompts;
  # with nothing pending it is a no-op, so running it on every commit that touches apps/api is
  # safe.
  migrate:
    name: Migrate production database
    needs: [changes, backend-test, frontend-test, quality-api, quality-web, build-api, build-web]
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      # `migrate:prod` sets PRISMA_ENV_FILE=.env.production, and loadPrismaEnv() throws when that
      # file is missing - deliberately, so a command aimed at production never quietly falls back
      # to another database. The runner has no such file, so it is built from the secret.
      #
      # Setting the variables at job level does not work: setup-workspace copies .env.example to
      # .env and loadPrismaEnv() loads that file with override: true, so the file always beats the
      # environment.
      - name: Write the production env file
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "::error::secrets.DIRECT_DATABASE_URL is empty or unset." >&2
            echo "Take the value from apps/api/.env.production, then add it under" >&2
            echo "Settings -> Secrets and variables -> Actions in this repository." >&2
            exit 1
          fi
          # DATABASE_URL is written too: prisma.config.ts reads DIRECT_DATABASE_URL first, but
          # loadPrismaEnv() still needs a valid variable source if the file is otherwise empty.
          {
            printf 'DATABASE_URL=%s\n' "$DIRECT_DATABASE_URL"
            printf 'DIRECT_DATABASE_URL=%s\n' "$DIRECT_DATABASE_URL"
          } > apps/api/.env.production

      # This step only prints which migrations production is behind on, for the log. But
      # `prisma migrate status` exits 1 when there ARE unapplied migrations - exactly the
      # situation it exists to report - so under `bash -e` it kills the job before the apply
      # step, taking deploy-api and deploy-web down with it. The exit code is swallowed:
      # `migrate deploy` below owns the pass/fail decision.
      - name: Show what production is behind
        run: pnpm --filter api migrate:prod:status || true

      - name: Apply migrations
        run: pnpm --filter api migrate:prod

  # Deploys run once EVERY test job is green, and only for a commit already on main.
  #
  # Since the test jobs became path-filtered, `needs` alone no longer gates anything: a dependency
  # that is legitimately skipped (its area did not change) skips the dependent job along with it.
  # So the condition has to be always() plus an explicit check that no dependency failed or was
  # cancelled.
  #
  # Vercel no longer deploys on its own (git.deploymentEnabled = false in apps/*/vercel.json), so
  # this is the only route code takes to production.
  deploy-api:
    name: Deploy API
    # Records the deploy in GitHub's Deployments tab. `vercel deploy` runs on a token and creates
    # no record of its own; since the git integration was turned off (2026-08-16) that tab stopped
    # showing real deploys even though production kept shipping.
    environment:
      name: production-api
      url: https://guild-manager-api.vercel.app
    needs: [changes, backend-test, frontend-test, quality-api, quality-web, build-api, build-web, migrate]
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deploy-vercel
        with:
          project-id: ${{ env.VERCEL_API_PROJECT_ID }}
          token: ${{ secrets.VERCEL_TOKEN }}

  # The frontend deploys after the backend: web calls the API, so the API has to be up first. When
  # a commit touches only web, deploy-api is skipped and this job still runs - the ordering only
  # binds when both of them deploy.
  deploy-web:
    name: Deploy web
    environment:
      name: production-web
      url: https://mmgh-nth.vercel.app
    needs: [changes, backend-test, frontend-test, quality-api, quality-web, build-api, build-web, migrate, deploy-api]
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deploy-vercel
        with:
          project-id: ${{ env.VERCEL_WEB_PROJECT_ID }}
          token: ${{ secrets.VERCEL_TOKEN }}
