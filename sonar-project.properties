# SonarQube Cloud analysis, run by the `SonarQube` job in .github/workflows/ci.yml.
#
# Everything that describes the workspace lives here rather than in the workflow's `args:`, so a
# scanner run from a laptop reads the same configuration CI does. The workflow passes exactly one
# `-D` of its own: `sonar.qualitygate.wait`, which is about how CI behaves, not about this project.
#
# Both keys below are assigned by SonarQube Cloud when the repository is imported. They are
# identifiers, not credentials — the credential is the SONAR_TOKEN secret.
sonar.organization=minhhuy1201
sonar.projectKey=minhhuy1201_guild-manager

# `packages/shared` is listed on purpose: it is the contract both apps run on, so an issue there is
# an issue in both.
sonar.sources=apps/api/src,apps/web,packages/shared
# Sonar refuses to run when one file is both a source and a test, so the test set is carved out of
# the same directories by inclusion pattern rather than listed as separate paths.
sonar.tests=apps/api/src,apps/web,packages/shared
sonar.test.inclusions=**/*.spec.ts,**/__tests__/**
# The same two patterns repeat in `sonar.exclusions` below, and the repetition is required rather
# than sloppy: `sonar.exclusions` filters the *main* file set only, it does not touch the test set
# `sonar.test.inclusions` builds. Without it every spec file lands in both sets and the scanner
# aborts with "can be indexed only once" before analysing anything.

# `apps/web/*.config.*` rather than `**/*.config.*`: the broad form also swallowed
# `apps/api/src/config/app.config.ts`, which is product code, not tooling. Sonar does not complain
# about an over-broad exclusion — the file simply stops being analysed, and the scanner's only trace
# of it is one "Could not resolve file paths" line about the coverage report.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,apps/web/*.config.*,apps/api/prisma/migrations/**,apps/web/public/**,**/*.spec.ts,**/__tests__/**

# Coverage is produced by the two apps' test runs. `packages/shared` is compiled to `dist` and
# executed from there through node_modules, so no lcov report can attribute a line back to its
# sources: left measured, the contract package reads as 0% and drags "coverage on new code" under
# the gate on every PR that touches it. It stays in `sonar.sources` above — issues and duplication
# there are still reported, and they are what listing it was for.
sonar.coverage.exclusions=packages/shared/**

# Written by `test:cov` in each app. Note apps/api: Jest's `coverageDirectory` is relative to its
# `rootDir` (`src`), so the report lands beside the app, not at the repository root. A path that
# does not exist is not an error for the scanner — it silently reports 0% coverage, which is the
# failure mode worth watching for here.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
